<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Error loading page</title>
<style>
  body { font-family: system-ui, sans-serif; color: #202124; background: #fff; margin: 0; padding: 12vh 24px 24px; }
  main { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1.6em; font-weight: 500; margin: 0 0 16px; }
  p { margin: 8px 0; line-height: 1.5; }
  #url { word-break: break-all; font-weight: 600; }
  ul { color: #5f6368; padding-left: 1.4em; }
  .code { color: #5f6368; font-size: 0.85em; margin-top: 24px; }
  .detail { color: #5f6368; font-size: 0.8em; word-break: break-all; font-family: monospace; }
  button { margin-top: 20px; padding: 8px 20px; font-size: 1em; border: 0; border-radius: 4px; background: #1a73e8; color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    body { background: #202124; color: #e8eaed; }
    ul, .code, .detail { color: #9aa0a6; }
  }
</style>
</head>
<body data-kind="${kind}" data-code="${code}" data-status="${status}" data-host="${host}">
<main>
  <h1 id="title"></h1>
  <p id="lead"></p>
  <p>URL: <span id="url">${url}</span></p>
  <ul id="hints"></ul>
  <button id="reload" type="button"></button>
  <p class="code" id="code"></p>
  <p class="detail" id="detail">${detail}</p>
</main>
<script>
  const T = {
    en: {
      reload: "Reload",
      name_not_resolved: ["This site can’t be reached", "The server IP address of {host} could not be found.", ["Check that the address is spelled correctly", "Check your network connection and DNS settings"]],
      connection_refused: ["This site can’t be reached", "{host} refused to connect.", ["Check that the server is running", "Check the port number in the address"]],
      timed_out: ["This site can’t be reached", "{host} took too long to respond.", ["Check your network connection", "Try again later"]],
      connection_reset: ["This site can’t be reached", "The connection to {host} was reset.", ["Try again later"]],
      unreachable: ["This site can’t be reached", "The network or {host} could not be reached.", ["Check your network connection"]],
      connection_failed: ["This site can’t be reached", "Could not connect to {host}.", ["Check your network connection", "Try again later"]],
      unsupported_scheme: ["This page can’t be opened", "The address uses a scheme that is not supported.", []],
      redirects: ["This page isn’t working", "{host} redirected you too many times.", ["Try again later"]],
      blocked: ["This page was blocked", "The request to {host} was blocked.", []],
      failed: ["This page can’t be loaded", "Could not load the page from {host}.", ["Try again later"]],
      not_found: ["This page can’t be found", "No page was found for the web address.", ["Check that the address is spelled correctly"]],
      server_error: ["This page isn’t working", "{host} is currently unable to handle this request.", ["Try again later"]],
      http_error: ["This page isn’t working", "{host} returned an error and no content.", []]
    },
    ja: {
      reload: "再読み込み",
      name_not_resolved: ["このサイトにアクセスできません", "{host} のサーバー IP アドレスを見つけられませんでした。", ["アドレスの綴りに誤りがないか確認してください", "ネットワーク接続と DNS 設定を確認してください"]],
      connection_refused: ["このサイトにアクセスできません", "{host} に接続を拒否されました。", ["サーバーが起動しているか確認してください", "アドレスのポート番号を確認してください"]],
      timed_out: ["このサイトにアクセスできません", "{host} から応答がありませんでした（タイムアウト）。", ["ネットワーク接続を確認してください", "しばらくしてからやり直してください"]],
      connection_reset: ["このサイトにアクセスできません", "{host} との接続がリセットされました。", ["しばらくしてからやり直してください"]],
      unreachable: ["このサイトにアクセスできません", "ネットワーク、または {host} に到達できません。", ["ネットワーク接続を確認してください"]],
      connection_failed: ["このサイトにアクセスできません", "{host} に接続できませんでした。", ["ネットワーク接続を確認してください", "しばらくしてからやり直してください"]],
      unsupported_scheme: ["このページを開けません", "このアドレスのスキームには対応していません。", []],
      redirects: ["このページは正常に動作していません", "{host} によるリダイレクトが多すぎます。", ["しばらくしてからやり直してください"]],
      blocked: ["このページはブロックされました", "{host} へのリクエストはブロックされました。", []],
      failed: ["このページを読み込めません", "{host} からページを読み込めませんでした。", ["しばらくしてからやり直してください"]],
      not_found: ["このページが見つかりません", "このアドレスのページは見つかりませんでした。", ["アドレスの綴りに誤りがないか確認してください"]],
      server_error: ["このページは正常に動作していません", "{host} は現在このリクエストを処理できません。", ["しばらくしてからやり直してください"]],
      http_error: ["このページは正常に動作していません", "{host} がエラーを返し、内容がありませんでした。", []]
    }
  };
  const b = document.body.dataset;
  const lang = ((navigator.language || "en").slice(0, 2) === "ja") ? "ja" : "en";
  const t = T[lang][b.kind] || T[lang].failed;
  document.documentElement.lang = lang;
  document.getElementById("title").textContent = t[0];
  document.getElementById("lead").textContent = t[1].replace("{host}", b.host);
  const hints = document.getElementById("hints");
  for (const h of t[2]) {
    const li = document.createElement("li");
    li.textContent = h;
    hints.appendChild(li);
  }
  document.title = t[0];
  const reload = document.getElementById("reload");
  reload.textContent = T[lang].reload;
  reload.onclick = function() { location.reload(); };
  document.getElementById("code").textContent = b.code;
</script>
</body>
</html>
